services:
########## HOMEPAGE DASHBOARD CONFIGURATION ##########
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homepage-socket-proxy
    environment:
      - CONTAINERS=1
      - EVENTS=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
      - /tmp
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=192.168.178.69:3000,home.kodyparton.com
    env_file:
      - .env
    volumes:
      - ./config:/app/config
    ports:
      - 3000:3000
    depends_on:
      - socket-proxy
    restart: unless-stopped
