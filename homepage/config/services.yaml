    - Uptime Kuma:
        icon: uptime-kuma.png
        href: https://uptime.kodyparton.com
        description: Uptime & status monitoring
        server: my-docker
        container: uptime-kuma
        # Works with no credentials -- it reads the public status page rather
        # than the admin API. The `default` status page is created, populated,
        # and published by scripts/kuma_seed_monitors.sh; run that if this card
        # reads 0 up / 0 down. Note that Kuma answers HTTP 200 with empty lists
        # for a slug that does NOT exist, so an empty card cannot distinguish
        # "no monitors" from "no status page" -- check the DB, not the endpoint.
        widget:
          type: uptimekuma
          url: http://192.168.178.69:30038
          slug: default

