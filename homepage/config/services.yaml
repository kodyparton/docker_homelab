- Network & Storage:
    - UNAS Pro:
        icon: unifi.png
        href: https://nas.kodyparton.com
        description: UniFi NAS Pro — admin console (UniFi OS 4.0.3)
        # href goes through NPM (real wildcard cert, no browser warning);
        # the health check stays on the raw IP deliberately.
        #
        # ICMP ping, not siteMonitor. Pointing siteMonitor at the appliance
        # directly fails both ways: https:// is a self-signed cert Homepage's
        # fetch rejects, and http:// 301s to https, which its redirect follower
        # refuses with ERR_INVALID_PROTOCOL (verified in the container logs).
        # Pointing it at the NPM name instead would work, but would then be
        # testing the proxy rather than the device -- ping answers the question
        # this card is actually for: "is the NAS itself reachable?", which is
        # what kills every CIFS-mounted container when it blips
        # (see docs/architecture/known-issues.md).
        ping: 192.168.178.38

    - Ziggo Modem:
        icon: mdi-router-network
        href: https://ziggo.kodyparton.com
        description: Ziggo cable modem / gateway — WAN uplink
        # Same split as the UNAS above: browse via NPM, health-check the device
        # itself. This is the WAN edge, so it going away explains an internet
        # outage that no container-level check would account for.
        ping: 192.168.178.1

