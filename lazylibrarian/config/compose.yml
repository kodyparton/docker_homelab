services:
########### LAZYLIBRARIAN CONFIGURATION ##########
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - DOCKER_MODS=linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg #optional
    volumes:
      - /Users/kp-srv-01/Documents/docker/lazylibrarian/config:/config
      - nas_downloads:/downloads
      - nas_books:/books #optional
    ports:
      - 30032:5299
    restart: unless-stopped

volumes:
  nas_downloads:
    external: true
  nas_books:
    external: true
