services:
########## OLLAMA CONFIGURATION (local LLM runtime for the second brain) ##########
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      # Model store moved to the external SSD 2026-08-27 - models are ~4.6GB
      # and re-downloadable, so this is low-risk. If /Volumes/FastSSD is not
      # mounted, ollama will start with an EMPTY model list rather than fail
      # loudly - check this path first if models ever 'disappear'.
      - /Volumes/FastSSD/ollama/config:/root/.ollama
    ports:
      - 11434:11434
    environment:
      - TZ=America/Chicago
      # No GPU passthrough is available to Docker containers on macOS, so
      # inference here is CPU-only and slow (~40s for a short classify
      # call, warm). Keeping the model resident avoids paying an
      # additional ~25s reload penalty every time it's been idle for
      # more than the 5m default.
      - OLLAMA_KEEP_ALIVE=60m
    restart: unless-stopped
