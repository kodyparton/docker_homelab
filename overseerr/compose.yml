services:
########## SEERR CONFIGURATION (migrated from Overseerr 2026-08-29) ##########
  overseerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: overseerr
    environment:
      - TZ=Europe/Amsterdam
    volumes:
      - /Users/kp-srv-01/Documents/docker/overseerr/config:/app/config
    ports:
      - 30023:5055
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: always
