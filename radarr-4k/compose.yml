services:
########## RADARR-4K CONFIGURATION ##########
  radarr-4k:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-4k
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /Users/kp-srv-01/Documents/docker/radarr-4k/config:/config
      - nas_movies_4k:/mnt/movies-4k #optional
      - nas_downloads:/mnt/downloads/movies-4k
    ports:
      - 30031:7878
    restart: always

volumes:
  nas_movies_4k:
    external: true
  nas_downloads:
    external: true
