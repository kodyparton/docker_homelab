services:
########## RADARR CONFIGURATION ##########
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /Users/kp-srv-01/Documents/docker/radarr/config:/config
      - nas_movies:/mnt/movies
      - nas_downloads:/mnt/downloads
    ports:
      - 30025:7878
    restart: always

volumes:
  nas_movies:
    external: true
  nas_downloads:
    external: true
