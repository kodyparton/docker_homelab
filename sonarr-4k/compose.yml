services:
########## SONARR-4K CONFIGURATION ##########
  sonarr-4k:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-4k
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /Users/kp-srv-01/Documents/docker/sonarr-4k/config:/config
      - nas_tv_4k:/mnt/tv-4k #optional
      - nas_downloads:/mnt/downloads
    ports:
      - 30030:8989
    restart: always

volumes:
  nas_tv_4k:
    external: true
  nas_downloads:
    external: true
