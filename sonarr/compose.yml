services:
########## SONARR CONFIGURATION ##########
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - /Users/kp-srv-01/Documents/docker/sonarr/config:/config
      - nas_tv:/mnt/tv #optional
      - nas_downloads:/mnt/downloads
    ports:
      - 30027:8989
    restart: always

volumes:
  nas_tv:
    external: true
  nas_downloads:
    external: true
