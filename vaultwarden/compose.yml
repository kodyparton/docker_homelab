services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "30040:80"
    volumes:
      - ./data:/data
    environment:
      - TZ=Europe/Amsterdam
      - DOMAIN=http://192.168.178.69:30040
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      # Open signups off - accounts are created deliberately, not by anyone
      # who can reach the LAN. Invite users via the /admin panel instead.
      - SIGNUPS_ALLOWED=false
      - INVITATIONS_ALLOWED=true
      # ---- SSO (Authelia) ----
      # Deliberately configured alongside, NOT replacing, local login: if
      # Authelia is down this vault must still open. See docs/architecture/sso.md.
      - SSO_ENABLED=true
      - SSO_ONLY=false
      - SSO_AUTHORITY=https://auth.kodyparton.com
      - SSO_CLIENT_ID=vaultwarden
      - SSO_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - SSO_SCOPES=openid email profile offline_access
      # ---- SMTP (Gmail relay, added 2026-08-29) ----
      # Emergency access, org invites, 2FA emails, new-device login alerts.
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURITY=starttls
      - SMTP_FROM=${SMTP_USERNAME}
      - SMTP_FROM_NAME=Vaultwarden
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
